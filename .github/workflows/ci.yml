name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.97.0
  FLUTTER_VERSION: 3.47.7
  CARGO_TERM_COLOR: always
  ANDROID_API_LEVEL: '36'
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets

  flutter:
    name: Flutter checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android:
    name: Android signing flow and APK
    needs: [rust, flutter]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: x86_64-linux-android,aarch64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rust
            rust -> ../build/signer_core/build
          key: android-${{ env.ANDROID_NDK_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install the pinned Android build tools
        run: |
          sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          flutter config --jdk-dir "$JAVA_HOME"
          flutter precache --android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the Android signer and verify its response
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          emulator-port: 5554
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: bash integration_test/run_android.sh emulator-5554
      - name: Build the release-mode prototype APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Check the packaged APK
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          permissions="$(apkanalyzer manifest permissions "$apk")"
          if grep -Eq 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)([[:space:]]|$)' <<< "$permissions"; then
            echo 'Release APK unexpectedly requests network permissions.' >&2
            exit 1
          fi
          test "$(apkanalyzer manifest debuggable "$apk")" = false
          unzip -Z1 "$apk" | grep -x 'lib/arm64-v8a/libsigner_core.so'
      - name: Upload the prototype APK and signer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zigner-prototype-arm64
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/ci/signer-response.json
          if-no-files-found: error
          retention-days: 7
