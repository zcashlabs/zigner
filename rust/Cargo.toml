[package]
name = "signer_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
ur-registry = { git = "https://github.com/valargroup/keystone-sdk-rust.git", rev = "c2119436f5246be05b1ba877a7e6b63f51c01339", package = "ur-registry", default-features = false, features = ["std"] }
pczt = { package = "zakura-pczt", version = "=0.1.0-rc9", features = ["orchard", "signer"] }
orchard = { package = "zakura-orchard", version = "=4.0.0" }
sapling = { package = "zakura-sapling-crypto", version = "=4.0.0", features = ["wallet"] }
transparent = { package = "zakura-transparent", version = "=4.0.0", features = ["pczt"] }
zcash_keys = { package = "zakura-keys", version = "=4.0.0", features = ["orchard"] }
zcash_protocol = { package = "zakura-protocol", version = "=4.0.0" }
zip32 = "0.2"
rand = "0.10"

[dev-dependencies]
pczt = { package = "zakura-pczt", version = "=0.1.0-rc9", features = ["zcp-builder"] }
zcash_primitives = { package = "zakura-primitives", version = "=4.0.0", default-features = false, features = ["pczt", "std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
